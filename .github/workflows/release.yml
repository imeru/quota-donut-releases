name: Release
# Runs in this public repo so Actions minutes are free; the private source is read with a read-only deploy key.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Source tag to build, e.g. v0.3.0
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # Universal build runs on both Apple Silicon and Intel Macs; dmg is for first installs.
            args: --bundles app,dmg --target universal-apple-darwin
          - os: windows-latest
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: imeru/quota-donut
          ref: ${{ inputs.tag }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
        working-directory: src
      - run: npm test
        working-directory: src
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src
          tagName: ${{ inputs.tag }}
          releaseName: Quota Donut ${{ inputs.tag }}
          releaseBody: Quota Donut ${{ inputs.tag }}
          releaseDraft: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}
  publish:
    # Publish only after both platforms uploaded, so latest.json never lists one platform alone.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "${{ inputs.tag }}" --draft=false --latest -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
